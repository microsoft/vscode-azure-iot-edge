    steps:
    - task: NodeTool@0
      displayName: Install NodeJs
      inputs:
        versionSpec: '22.x'
        checkLatest: true

    - script: |
        npm install
        npm install -g @vscode/vsce@4.0.0
      displayName: 'npm install'

    - script: |
        export PROD_AIKEY=$(PROD_AIKEY)
        export ISPRODTAG=v?[0-9]+\.[0-9]+\.[0-9]+$
        npm run tslint
        npm run compile
        node scripts/genAiKey.js
        echo "y"  | vsce package
      displayName: 'npm Package'